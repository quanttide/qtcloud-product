# 部署 studio：推送 studio/* tag（如 studio/v0.0.1，由 qtcloud-devops release publish 创建）时，
# 构建 Flutter Web 产物上传到 OSS 静态网站桶，并刷新 CDN 缓存。
#
# 架构（对齐 qtcloud-secret 部署模式）：
#   studio/* tag → Actions（flutter build web + ossutil cp）→ OSS 桶（静态网站模式）
#   → 阿里云 CDN（product.cloud.quanttide.com，单域名证书）→ 用户浏览器
#
# 所需 GitHub secrets（org 级）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET：RAM 用户 AccessKey（OSS 上传 + CDN 刷新）
#
# 基础设施（manifests/terraform，已 IaC 化）：
#   - OSS 桶 qtcloud-product-studio：静态网站托管 + 私有 ACL（studio-bucket.tf）
#   - CDN 域名 product.cloud.quanttide.com + 私有回源（l2_oss_key/oss_auth）+
#     根路径改写 + RAM 角色 + DNS（cdn.tf）
#   - HTTPS 单域名证书由 acme.sh 管理（*.quanttide.com 泛域名证书不匹配两层子域）

name: Deploy Studio

on:
  push:
    tags:
      - 'studio/**'

concurrency:
  group: deploy-studio
  cancel-in-progress: false

env:
  OSS_BUCKET: qtcloud-product-studio
  OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
  CDN_DOMAIN: product.cloud.quanttide.com

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy to OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 锁版本 3.44.8（与 qtcloud-secret / qtcloud-delib 部署模板一致）：
      # 项目要求 SDK 3.10.4+，旧版 Flutter 构建会失败
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Build Web
        working-directory: src/studio
        run: |
          flutter pub get
          flutter build web --release

      # 禁用 Service Worker（内部工具部署）：SW 的 cacheFirst 策略会让浏览器长期
      # 缓存固定路径的种子数据 JSON（assets/data/...），发布后用户硬刷新也拿不到新数据。
      # 做法：产物 index.html 注入禁用补丁 + 删除 SW 脚本（与本地预览一致）。
      - name: Disable Service Worker
        working-directory: src/studio
        run: |
          python3 - <<'EOF'
          p = 'build/web/index.html'
          s = open(p).read()
          patch = '''  <!-- 内部工具部署：卸载旧 Service Worker 并禁止新注册，避免缓存旧数据 -->
          <script>
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) { reg.unregister(); });
              });
              navigator.serviceWorker.register = function () { return Promise.resolve(null); };
            }
          </script>
          '''
          if 'serviceWorker.register = function' not in s:
              s = s.replace('<base href="/">', '<base href="/">\n' + patch)
              open(p, 'w').write(s)
          EOF
          rm -f build/web/flutter_service_worker.js

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # 缓存策略分离（Flutter Web 部署要点）：
      # - 入口文件（index.html / bootstrap / manifest）必须 no-cache，
      #   否则浏览器与 SW 缓存旧入口，发布后用户永远看到旧版本
      # - 其余产物（main.dart.js / assets 哈希文件）可长缓存
      # - flutter_service_worker.js 已在上一步删除（SW 已禁用）
      - name: Upload to OSS（产物长缓存）
        run: ossutil cp src/studio/build/web/ oss://${{ env.OSS_BUCKET }}/ -r -f --meta=Cache-Control:public,max-age=31536000

      - name: Upload to OSS（入口文件 no-cache）
        run: |
          for f in index.html flutter_bootstrap.js manifest.json favicon.png version.json; do
            ossutil cp "src/studio/build/web/$f" "oss://${{ env.OSS_BUCKET }}/$f" -f --meta=Cache-Control:no-cache
          done

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          req = RefreshObjectCachesRequest()
          req.set_ObjectPath('https://${{ env.CDN_DOMAIN }}/')
          req.set_ObjectType('Directory')
          cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
